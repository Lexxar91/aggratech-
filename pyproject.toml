[project]
name = "aggratech"
version = "0.1.0"
description = "FSP MVP: modular monolith and isolated assessment runner"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "email-validator==2.3.0",
    "pwdlib[argon2]==0.3.1",
    "PyJWT==2.15.1",
    "reportlab==5.0.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
    "pypdf==6.19.0",
    "playwright==1.63.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 88
# Сохранённый человеческий источник неизменяем: форматирование сменит его SHA.
extend-exclude = ["bank/sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "runner", "tests", "migrations"]

# ReportLab не поставляет py.typed; типы наших границ проверяются строго.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: requires real PostgreSQL and applied migrations",
    "runner: requires the Compose docker-limited controller and mutual TLS",
]
